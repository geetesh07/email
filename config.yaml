# Engineering Email Intelligence Tool — Configuration
# ──────────────────────────────────────────────────

# ── Salesforce Credentials (optional) ──
salesforce:
  username: ""
  password: ""
  security_token: ""
  domain: "login"  # or "test" for sandbox

# ── Signature Detection Patterns ──
signature_markers:
  - "--"
  - "Best regards"
  - "Kind regards"
  - "Regards"
  - "Thanks & Regards"
  - "Thanks and Regards"
  - "Warm regards"
  - "Sincerely"
  - "Sent from my"
  - "Get Outlook for"

# ── Disclaimer Phrases (case-insensitive) ──
disclaimer_phrases:
  - "this email is confidential"
  - "intended recipient"
  - "if you are not the intended"
  - "this message contains confidential"
  - "privileged and confidential"
  - "unauthorized use"
  - "legally privileged"
  - "disclaimer"
  - "do not print this email"

